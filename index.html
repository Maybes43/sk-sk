<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slovenský zošit</title>
<meta name="description" content="Тренажёр словацкого: слова по урокам и темам, интервальные повторения, глаголы, озвучка.">
<meta name="theme-color" content="#1D5E8F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zošit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a single school exercise notebook ("zošit") — one card with a red margin rule, tabs as notebook sections. */
:root{
  --paper:#EEF2F1; --sheet:#FFFFFF; --ink:#1B2432; --muted:#5B6873; --rule:#D5DEE2;
  --accent:#1D5E8F; --accent-soft:#E0ECF5; --margin:#D98676;
  --ok:#2C7A4D; --ok-soft:#E1F1E7; --bad:#B03E28; --bad-soft:#F7E3DE; --warn:#8C6200; --warn-soft:#F7EDD2;
  --f-word:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161C; --sheet:#19202A; --ink:#E4E9EE; --muted:#93A0AA; --rule:#2A3440;
  --accent:#82B6DE; --accent-soft:#1C3347; --margin:#8A4A3E;
  --ok:#6FC291; --ok-soft:#163325; --bad:#EA8670; --bad-soft:#3B1E18; --warn:#E2B85C; --warn-soft:#382C10; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161C; --sheet:#19202A; --ink:#E4E9EE; --muted:#93A0AA; --rule:#2A3440;
  --accent:#82B6DE; --accent-soft:#1C3347; --margin:#8A4A3E;
  --ok:#6FC291; --ok-soft:#163325; --bad:#EA8670; --bad-soft:#3B1E18; --warn:#E2B85C; --warn-soft:#382C10; color-scheme:dark}
/* The app's own theme picker. "auto" follows the system theme above. */
:root[data-skin="light"]{
  --paper:#EEF2F1; --sheet:#FFFFFF; --ink:#1B2432; --muted:#5B6873; --rule:#D5DEE2;
  --accent:#1D5E8F; --accent-soft:#E0ECF5; --margin:#D98676;
  --ok:#2C7A4D; --ok-soft:#E1F1E7; --bad:#B03E28; --bad-soft:#F7E3DE; --warn:#8C6200; --warn-soft:#F7EDD2; color-scheme:light}
:root[data-skin="gray"]{
  --paper:#DFE2E5; --sheet:#EEF0F2; --ink:#22272D; --muted:#5F6770; --rule:#C6CCD2;
  --accent:#3E5A73; --accent-soft:#D5DEE6; --margin:#B98B80;
  --ok:#2F6F4B; --ok-soft:#D7E7DC; --bad:#A3412E; --bad-soft:#EDD9D4; --warn:#7D5C0A; --warn-soft:#ECE2C6; color-scheme:light}
:root[data-skin="blue"]{
  --paper:#0F1A2B; --sheet:#16243A; --ink:#E3ECF7; --muted:#8FA3BC; --rule:#263752;
  --accent:#7DB8F0; --accent-soft:#1B3454; --margin:#8C4E48;
  --ok:#6FC291; --ok-soft:#153427; --bad:#EE8B76; --bad-soft:#3B2026; --warn:#E5BC62; --warn-soft:#352C17; color-scheme:dark}
:root[data-skin="dark"]{
  --paper:#121212; --sheet:#1C1C1D; --ink:#EBEBEB; --muted:#9B9B9E; --rule:#2E2E31;
  --accent:#9DBCE0; --accent-soft:#25303C; --margin:#7A4840;
  --ok:#78C496; --ok-soft:#1A2E22; --bad:#E98A75; --bad-soft:#3A2220; --warn:#E0B963; --warn-soft:#33291A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-word);font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0}
.brand i{color:var(--accent);font-style:italic}
.today{color:var(--muted);font-size:13px}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.prefs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.langs{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.langs button{font:600 11px var(--f-num);letter-spacing:.04em;border:0;background:none;color:var(--muted);padding:6px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.skins{display:inline-flex;gap:5px;padding:4px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(127,127,127,.45);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.sw-auto{background:linear-gradient(135deg,#FFFFFF 50%,#19202A 50%)}
.sw-light{background:#FFFFFF}.sw-gray{background:#C6CCD2}.sw-blue{background:#16243A}.sw-dark{background:#1C1C1D}
@media (max-width:480px){header{align-items:flex-start}.hdr-right{width:100%;flex-direction:row;justify-content:space-between;align-items:center}}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}
nav{display:flex;gap:2px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
nav button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 12px 9px;box-shadow:inset 0 -2px 0 transparent;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0;display:inline-flex;align-items:center;gap:6px}
nav button:hover{color:var(--ink)}
@media (max-width:420px){nav{gap:0}nav button{flex:1 1 auto;justify-content:center;padding:10px 6px 9px;font-size:14px}}
nav button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
nav .count{font-family:var(--f-num);font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 6px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{font:inherit;font-size:13px;background:none;border:0;padding:7px 12px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--sheet);color:var(--muted);border-radius:16px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.meta{font-size:13px;color:var(--muted)}
.grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:52px;flex:none}
.filterbox{border:1px solid var(--rule);border-radius:10px;background:var(--sheet)}
.filterbox summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.filterbox summary::-webkit-details-marker{display:none}
.filterbox summary b{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filterbox summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s;flex:none}
.filterbox[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.filterbox .inner{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--rule)}
.filterbox .inner .bar{padding-top:8px}
#tagBar .chip{color:var(--ink);display:inline-flex;align-items:center;gap:8px;border-radius:16px;padding:3px 4px 3px 12px;line-height:1.4}
#tagBar .chip .n{font-family:var(--f-num);font-size:11px;font-weight:500;color:var(--muted);background:var(--paper);border-radius:10px;padding:1px 7px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
#tagBar .chip[aria-pressed="true"] .n{background:var(--sheet);color:inherit}
#tagBar .chip:not(:has(.n)){padding-right:12px}
.meta b{font-family:var(--f-num);font-weight:500;color:var(--ink)}

/* the notebook page */
.page{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:26px 24px 24px 44px;min-height:300px;display:flex;flex-direction:column;gap:16px;
  background-image:linear-gradient(to right,transparent 30px,var(--margin) 30px,var(--margin) 31px,transparent 31px)}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.eyebrow .ff{color:var(--bad)}
.prompt{font-family:var(--f-word);font-size:clamp(28px,6vw,40px);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
.prompt small{display:block;font-family:var(--f-ui);font-size:15px;color:var(--muted);font-weight:400;margin-top:6px}
.answer-row{display:flex;gap:8px;flex-wrap:wrap}
.answer-row input{flex:1 1 220px;min-width:0;font-family:var(--f-word);font-size:22px;padding:8px 12px;border:1px solid var(--rule);border-bottom:2px solid var(--accent);border-radius:6px;background:var(--paper);color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
label.btn{display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.keys{display:flex;flex-wrap:wrap;gap:5px}
.keys button{font-family:var(--f-word);font-size:18px;width:38px;height:38px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.keys button:active{background:var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
.result{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-soft)} .result.near{background:var(--warn-soft)} .result.bad{background:var(--bad-soft)}
.verdict{font-weight:600;font-size:14px}
.ok .verdict{color:var(--ok)} .near .verdict{color:var(--warn)} .bad .verdict{color:var(--bad)}
.correct{font-family:var(--f-word);font-size:28px;font-weight:600;line-height:1.2}
.correct mark{background:none;color:var(--warn);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.yours{font-size:13px;color:var(--muted)} .yours s{font-family:var(--f-word);font-size:16px}
.note{font-size:14px;border-left:3px solid var(--margin);padding-left:10px}
.grades{display:flex;flex-wrap:wrap;gap:8px}
.grades .btn{flex:1 1 110px}
@media (hover:none) and (pointer:coarse){kbd{display:none}}
.grades kbd{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-left:6px;font-weight:500}
.btn.primary kbd{color:inherit;opacity:.75}
.done{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.done h2{font-family:var(--f-word);font-size:28px;margin:0;font-weight:600}

table{border-collapse:collapse;width:100%}
.conj td{padding:5px 8px;border-bottom:1px solid var(--rule);font-size:15px}
.conj td:first-child{color:var(--muted);width:72px}
.conj td:last-child{font-family:var(--f-word);font-size:18px}
.conj tr.asked td{background:var(--accent-soft)}
.conj tr.asked td:first-child{color:var(--accent);font-weight:600}

/* dictionary */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form input,.form select,.search,textarea{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--rule);text-align:left;font-size:14px;vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl td.sk{font-family:var(--f-word);font-size:17px;white-space:nowrap}
.pill{font-size:11px;border-radius:9px;padding:2px 8px;white-space:nowrap;display:inline-block}
.pill.new{background:var(--paper);color:var(--muted)} .pill.learn{background:var(--warn-soft);color:var(--warn)} .pill.known{background:var(--ok-soft);color:var(--ok)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--rule);padding:4px;border-radius:12px}
.src button{font:inherit;border:0;border-radius:9px;background:transparent;color:var(--muted);padding:8px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.src button b{font-weight:600;font-size:15px;color:var(--ink)}
.src button small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src button[aria-pressed="true"]{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.src button[aria-pressed="true"] b{color:var(--accent)}
.batch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:2px 4px 2px 10px}
.batch select{font:600 13px var(--f-num);border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:4px 6px;cursor:pointer}
.say{display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--sheet);color:var(--accent);cursor:pointer;padding:0;vertical-align:middle}
html:not(.tts-on) .say{opacity:.5}
.say:hover{background:var(--accent-soft)}
.say.big{width:44px;height:44px}.say.big svg{width:22px;height:22px}
.say.sm{width:26px;height:26px;border-color:transparent;background:none;margin-right:4px}.say.sm svg{width:15px;height:15px}
.sayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sayrow .prompt{flex:1 1 auto;min-width:0}
.saycell{width:32px;text-align:right}
.tts-ctl{display:flex;flex-direction:column;gap:6px}
.cover-head{display:flex;gap:16px 24px;align-items:flex-end;flex-wrap:wrap}
.cover-num{font-family:var(--f-word);font-size:52px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.cover-num span{font-size:26px;color:var(--muted);margin-left:2px}
.cover-bar{position:relative;height:10px;border-radius:6px;background:var(--paper);margin:22px 0 4px}
.cover-bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.cover-bar s{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted);opacity:.5;text-decoration:none}
.cover-bar s em{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:500 10px var(--f-num);color:var(--muted);font-style:normal}
.cover-tops{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cover-tops b{color:var(--ink);font-family:var(--f-num);font-weight:500}
.cover-next{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cover-next .meta:first-child{width:100%}
.nextw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:16px;padding:2px 4px 2px 12px;font-size:14px}
.nextw [lang="sk"]{font-family:var(--f-word);font-size:16px}
.filters{display:grid;grid-template-columns:minmax(0,200px) minmax(0,160px) minmax(0,1fr);gap:8px}
.mark{font:inherit;background:none;border:1px solid transparent;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 5px;line-height:1}
.mark span{font-size:19px;line-height:1;width:1em;text-align:center}
.mark.star[aria-pressed="true"]{color:var(--warn)}
.mark.known span{font-size:16px;font-weight:700}
.mark.known[aria-pressed="false"] span{opacity:.45}
.mark.known[aria-pressed="true"]{color:var(--ok)}
.mark.wide{border-color:var(--rule);padding:6px 10px;font-size:13px}
.mark.wide em{font-style:normal}
.mark.wide.star[aria-pressed="true"]{background:var(--warn-soft);border-color:transparent}
.mark.wide.known[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent}
.marks{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.markcell{white-space:nowrap;width:64px;padding-right:0!important}
tr.is-known td.sk,tr.is-known td:nth-child(3){color:var(--muted)}
.chip.knownchip[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.seg .n{font-family:var(--f-num);font-size:11px;opacity:.7}
.bar.dim,.filterbox.dim{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;max-width:min(560px,calc(100% - 32px));font-size:14px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast .btn.quiet{color:var(--sheet);text-decoration:underline;padding:6px 8px}
@media (max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters .search:last-child{grid-column:1/-1}}
.star{font:inherit;background:none;border:1px solid transparent;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:2px 6px;line-height:1}
.star span{font-size:20px;line-height:1}
.star[aria-pressed="true"]{color:var(--warn)}
.star.wide{border-color:var(--rule);padding:6px 10px;font-size:13px;flex:none}
.star.wide em{font-style:normal}
.star.wide[aria-pressed="true"]{background:var(--warn-soft);border-color:transparent}
.starcell{width:36px;padding-right:0!important}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip.pool[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn:disabled{opacity:.45;cursor:default}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px}
.tile b{display:block;font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.days i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.days i.zero{background:var(--rule)}
.days small{font-size:10px;color:var(--muted);font-family:var(--f-num)}
textarea{font-family:var(--f-num);font-size:12px;min-height:110px;resize:vertical}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:10px;border-radius:8px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.result{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
@media (max-width:480px){.page{padding:20px 16px 18px 38px;background-image:linear-gradient(to right,transparent 24px,var(--margin) 24px,var(--margin) 25px,transparent 25px)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>

function t(key, vars){
  const row = I18N_RAW[key]; let s = row ? (row[LANG_I] ?? row[0]) : key;
  if(vars) for(const k in vars) s = s.split("{"+k+"}").join(vars[k]);

}

const BASE_WORDS = WORDS_RAW.trim().split("\n").map(l=>{
  const [sk,ru,tag,g,note]=l.split("|");
  return {id:"b:"+sk, sk, ru, tags:[tag], g:g||"", note:note||""};
});
(function mergeLessons(){
  const byKey = new Map(BASE_WORDS.map(w=>[w.sk.normalize("NFC").toLowerCase(), w]));
  let lesson = "";
  for(const raw of LESSONS_RAW.trim().split("\n")){
    const l = raw.trim(); if(!l) continue;
    if(l.startsWith("#")){ lesson = l.slice(1).trim(); continue; }
    const [sk,ru,g,note] = l.split("|");
    const key = sk.normalize("NFC").toLowerCase();
    const old = byKey.get(key);
    if(old){ if(!old.tags.includes(lesson)) old.tags.unshift(lesson); if(!old.note && note) old.note=note; continue; }
    const tags = [lesson]; if(/\s/.test(sk.replace(/ \/ /g,"")) ) tags.push("phr");
    const w = {id:"b:"+sk, sk, ru, tags, g:g||"", note:note||""};
    BASE_WORDS.push(w); byKey.set(key, w);
  }
})();

function synonymsOf(w){

const PRES_P = ["ja","ty","on / ona","my","vy","oni"];
const PAST_P = ["ja","ty","on","ona","my","vy","oni"];
const VERBS = VERBS_RAW.trim().split("\n").map(l=>{
  const [inf,ru,pres,pm,pf,asp,core]=l.split("|");
  const m = inf.match(/^(\S+)(?: (sa|si))?$/);
  const base = m[1], refl = m[2]||"";
  const pastM = pm || (/ieť$/.test(base) ? base.replace(/ieť$/,"el") : base.replace(/ť$/,"l"));
  const pastF = pf || pastM+"a";
  const pastPl = pastF.slice(0,-1)+"i";
  return {inf, base, refl, ru, pres:pres.split(","), pastM, pastF, pastPl, pf:asp==="pf", core:core==="1"};
});

/* Build accepted answers. Without pronoun: clitics after the verb ("učil som sa").
   With pronoun: clitics before it ("ja som sa učil"). */
function verbForms(v, tense){
  const R = v.refl ? " "+v.refl : "";
  if(tense==="pres"){
    return v.pres.map((f,i)=>{
      const pron = ["ja","ty","on","my","vy","oni"][i];
      const shown = f+R;
      const acc = [shown, v.refl ? `${pron} ${v.refl} ${f}` : `${pron} ${f}`];
      if(i===2) acc.push(v.refl ? `ona ${v.refl} ${f}` : `ona ${f}`);
      return {p:PRES_P[i], shown, acc};
    });
  }
  const rows = [
    ["ja",v.pastM,"som"],["ty",v.pastM,"si"],["on",v.pastM,""],["ona",v.pastF,""],
    ["my",v.pastPl,"sme"],["vy",v.pastPl,"ste"],["oni",v.pastPl,""]
  ];
  return rows.map(([pron,form,aux])=>{
    const cl = [aux,v.refl].filter(Boolean).join(" ");
    const shown = cl ? `${form} ${cl}` : form;
    const withP = cl ? `${pron} ${cl} ${form}` : `${pron} ${form}`;
    return {p:pron, shown, acc:[shown, withP]};
  });
}

/* ============ STORAGE ============
   One adapter with load()/save(). This build keeps progress in the browser (localStorage).
   For your own server: replace load/save with fetch() calls to your API — the state is one JSON object. */
const LS_KEY = "slovensky-zosit-v1";
const Store = {
  kind:"local", ref:null, writing:false, pending:null,
  readLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  writeLocal(st){ try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){} },
  async connect(){ return false; },
  async loadRemote(){
    if(!this.ref) return null;
    const snap = await this.ref.get();
    if(!snap.exists) return null;
    const d = snap.data();
    try{ return JSON.parse(d.json); }catch(e){ return null; }
  },
  save(st){
    this.writeLocal(st);
    if(!this.ref) return;
    this.pending = st;
    clearTimeout(this.t);
    this.t = setTimeout(()=>this.flush(), 1200);
  },
  async flush(){
    if(this.writing || !this.pending || !this.ref) return;
    const st = this.pending; this.pending = null; this.writing = true;
    setSave("saving");
    try{ await this.ref.set({json:JSON.stringify(st), updatedAt:st.updatedAt}); setSave("db"); }
    catch(e){ setSave("err"); }
    this.writing = false;
    if(this.pending) this.flush();
  }
};

const DAY = 86400000;
function freshState(){ return {v:1, updatedAt:0, cards:{}, custom:[], pool:[], known:[], log:{}, newLog:{}, settings:{newPerDay:10, mode:"type", tags:[], cats:[], top:0, src:"lessons", set:"all", kind:"all", tense:"pres", vset:"lesson", lang:"ru", skin:"auto", ttsAuto:false, ttsRate:0.9}}; }
/* fill in fields added in later versions, so older saves keep working */
function normalize(d){
  const st=Object.assign(freshState(), d||{});
  st.settings=Object.assign(freshState().settings, (d&&d.settings)||{});
  if(st.settings.poolOnly){ st.settings.set="pool"; } delete st.settings.poolOnly;
  if(!Array.isArray(st.pool)) st.pool=[]; if(!Array.isArray(st.known)) st.known=[];
  return st;
}
let S = normalize(Store.readLocal());

function dayKey(t=Date.now()){ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function persist(){ S.updatedAt = Date.now(); Store.save(S); refreshCounts(); }
function allWords(){ return BASE_WORDS.concat(S.custom.map(c=>Object.assign({},c,{tags:["mine"]}))); }

/* SM-2 style scheduling. q: 0 again, 3 hard, 4 good, 5 easy */
function schedule(id, q){
  const c = S.cards[id] || {ef:2.5, iv:0, reps:0, lapses:0, due:0};
  if(q<3){ c.reps=0; c.iv=0; c.lapses++; c.due=Date.now()+10*60*1000; }
  else{
    c.reps++;
    if(c.reps===1) c.iv = q===5?3:1;
    else if(c.reps===2) c.iv = q===3?2:(q===5?6:4);
    else c.iv = Math.max(1, Math.round(c.iv * (q===3?1.2:c.ef) * (q===5?1.3:1)));
    c.ef = Math.max(1.3, c.ef + 0.1 - (5-q)*(0.08+(5-q)*0.02));
    c.due = Date.now() + c.iv*DAY;
  }
  c.seen = 1; S.cards[id]=c;
  const k=dayKey(); S.log[k]=S.log[k]||{n:0,ok:0}; S.log[k].n++; if(q>=3) S.log[k].ok++;
}
function status(id){ const c=S.cards[id]; if(!c||!c.seen) return "new"; return c.iv>=21?"known":"learn"; }

  const e = exactNorm(input), b = baseNorm(input);
  if(!e) return {r:"bad"};
  for(const a of accepted) if(exactNorm(a)===e) return {r:"ok", a};
  for(const a of accepted) if(baseNorm(a)===b) return {r:"near", a};
  return {r:"bad", a:accepted[0]};
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* underline the letters whose diacritics were missed */
function markDiff(correct, typed){
  const c=[...correct.normalize("NFC")], t=[...exactNorm(typed)];
  const lc=[...exactNorm(correct)];
  if(lc.length!==t.length) return esc(correct);
  return c.map((ch,i)=> lc[i]!==t[i] ? `<mark>${esc(ch)}</mark>` : esc(ch)).join("");
}

/* ============ PRONUNCIATION ============
   Uses the device's own speech synthesis; buttons appear only when a Slovak voice exists. */
const SPEAKER = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const TTS = {
  voice:null, api: typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined",
  init(){
    if(!this.api){ this.update(); return; }
    const pick=this.pick=()=>{ try{
      const vs=speechSynthesis.getVoices()||[];
      const sk=vs.filter(v=>/^sk([-_]|$)/i.test(v.lang||""));
      this.voice = sk.find(v=>v.localService) || sk[0] || null;
    }catch(e){ this.voice=null; } this.update(); };
    pick();
    try{ speechSynthesis.addEventListener("voiceschanged", pick); }catch(e){ speechSynthesis.onvoiceschanged=pick; }
    [300,1200,3000,6000].forEach(ms=>setTimeout(pick, ms));
  },
  get ok(){ return !!this.voice; },
  update(){
    document.documentElement.classList.toggle("tts-on", this.ok);
    const info=document.getElementById("ttsInfo"); if(!info) return;
    info.textContent = !this.api ? t("ttsNoApi") : this.ok ? t("ttsVoice",{v:this.voice.name}) : t("ttsNone");
    document.getElementById("ttsCtl").hidden = !this.ok;
    document.querySelectorAll(".say").forEach(b=>b.title = this.ok ? t("say") : t("ttsMissingShort"));
  },
  clean(text){ return String(text).replace(/…/g,"").replace(/\s*\/\s*/g,", ").trim(); },
  speak(text){
    if(!text) return;
    if(!this.ok){ this.pick&&this.pick(); if(!this.ok){ showToast(!this.api?t("ttsNoApi"):t("ttsMissing")); return; } }
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(this.clean(text));
      u.voice=this.voice; u.lang=this.voice.lang; u.rate=+S.settings.ttsRate||0.9;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  auto(text){ if(S.settings.ttsAuto) this.speak(text); }
};
function sayBtn(text, cls=""){ return `<button class="say ${cls}" type="button" data-say="${esc(text)}" title="${t("say")}" aria-label="${t("say")}: ${esc(text)}">${SPEAKER}</button>`; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-say]"); if(!b) return; e.preventDefault(); TTS.speak(b.dataset.say); const inp=document.querySelector(".page input:not(:disabled)"); if(inp && b.closest(".page")) inp.focus(); });

const $ = s=>document.querySelector(s);
let lastInput = null;
function keypad(el, targetId){
  el.innerHTML = DIACRITICS.map(d=>`<button type="button" tabindex="-1" aria-label="${t("insert")} ${d}">${d}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>{

/* ============ WORD SESSION ============ */
let queue = [], current = null, phase = "ask", extraNew = 0;
function cardId(w){ return w.id + ":" + (S.settings.mode==="type"?"t":"r"); }

/* phrases: several words, or a question / exclamation */
function isPhrase(w){ return /\s/.test(w.sk.replace(/ \/ /g,"")) || /[?!]$/.test(w.sk.trim()); }
function kindOk(w){ const k=S.settings.kind; return k==="all" || (k==="phrase")===isPhrase(w); }

/* ---- two personal lists: "pool" (repeat on demand) and "known" (already know, skip in training) ---- */
function inPool(id){ return S.pool.includes(id); }
function isKnown(id){ return S.known.includes(id); }
function setList(name, ids, on){
  const set=new Set(S[name]); ids.forEach(id=> on?set.add(id):set.delete(id)); S[name]=[...set];
  if(on){ const other=name==="pool"?"known":"pool"; const rm=new Set(ids); S[other]=S[other].filter(x=>!rm.has(x)); }
  persist(); renderTags();
}
function listWords(name){ const set=new Set(S[name]); return allWords().filter(w=>set.has(w.id)); }
function markBtn(kind, w, wide){
  const on = kind==="star" ? inPool(w.id) : isKnown(w.id);
  const t = MARK[kind][on?1:0];
  return `<button class="mark ${kind} ${wide?"wide":""}" type="button" data-${kind}="${esc(w.id)}" aria-pressed="${on}" title="${t.title}" aria-label="${t.title}: ${esc(w.sk)}"><span aria-hidden="true">${t.icon}</span>${wide?`<em>${t.label}</em>`:""}</button>`;
}
const MARK = {
  star:[{icon:"☆",get label(){return t("starOff")},get title(){return t("starOffT")}},{icon:"★",get label(){return t("starOn")},get title(){return t("starOnT")}}],
  known:[{icon:"✓",get label(){return t("knownOff")},get title(){return t("knownOffT")}},{icon:"✓",get label(){return t("knownOn")},get title(){return t("knownOnT")}}]
};
function paintMarks(id){
  for(const kind of ["star","known"]){
    const on = kind==="star" ? inPool(id) : isKnown(id), t=MARK[kind][on?1:0];
    document.querySelectorAll(`[data-${kind}="${CSS.escape(id)}"]`).forEach(b=>{
      b.setAttribute("aria-pressed",String(on)); b.title=t.title; b.setAttribute("aria-label",t.title);
      b.querySelector("span").textContent=t.icon; const em=b.querySelector("em"); if(em) em.textContent=t.label;
    });
  }
}
document.addEventListener("click",e=>{
  const st=e.target.closest("[data-star]"), kn=e.target.closest("[data-known]");
  if(!st && !kn) return;
  const id = st ? st.dataset.star : kn.dataset.known, name = st ? "pool" : "known";
  const turnOn = !S[name].includes(id), wasInPool = inPool(id);
  setList(name,[id],turnOn); paintMarks(id);
  if(tab==="dict"){ updateBulk(); return; }
  /* on a training card: "know it" takes the word out of this session, with an undo */
  if(kn && current && current.id===id && turnOn && S.settings.set!=="known"){
    const w=current; showToast(t("toastKnown",{w:w.sk}), ()=>{ setList("known",[w.id],false); if(wasInPool) setList("pool",[w.id],true); queue.unshift(w); nextCard(); });
    nextCard(); return;
  }
  updateSessionMeta();
  if(phase==="ask"&&$("#ans")) $("#ans").focus();
});
let toastT;
function showToast(text, undo){
  const t=$("#toast"); $("#toastText").textContent=text; t.hidden=false;
  $("#toastUndo").hidden=!undo;
  $("#toastUndo").onclick=()=>{ t.hidden=true; if(undo) undo(); };
  clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 7000);
}

function roundMode(){ return S.settings.set!=="all"; }
function inSource(w){ return S.settings.src==="lib" ? inLibrary(w) : inLessons(w); }
function selectedWords(){
  let ws;
  if(S.settings.set==="pool") ws=listWords("pool");
  else if(S.settings.set==="known") ws=listWords("known");
  else {
    const known=new Set(S.known);
    if(S.settings.src==="lib"){
      const cats=S.settings.cats, top=S.settings.top;
      ws=allWords().filter(w=>inLibrary(w) && !known.has(w.id) && (!cats.length||cats.includes(w.cat)) && (!top||(w.rank&&w.rank<=top)));
    } else {
      const tags=S.settings.tags;
      ws=allWords().filter(w=>inLessons(w) && !known.has(w.id) && (!tags.length || w.tags.some(t=>tags.includes(t))));
    }
  }
  return ws.filter(kindOk);
}
function newDoneToday(){ return S.newLog[dayKey()]||0; }
let roundSize=0;
function buildQueue(){
  const now=Date.now(), ws=selectedWords();
  if(roundMode()){
    /* the whole list every round, regardless of due dates: overdue first, then the rest shuffled */
    const due=[], rest=[];
    ws.forEach(w=>{ const c=S.cards[cardId(w)]; (c&&c.seen&&c.due<=now?due:rest).push(w); });
    for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
    queue=due.concat(rest); roundSize=queue.length; return;
  }
  const due = ws.filter(w=>{const c=S.cards[cardId(w)]; return c&&c.seen&&c.due<=now;})
                .sort((a,b)=>S.cards[cardId(a)].due-S.cards[cardId(b)].due);
  const room = Math.max(0, S.settings.newPerDay + extraNew - newDoneToday());
  /* new words: lessons in lesson order; library from the most frequent word down */
  const rank = S.settings.src==="lib" ? (w=>w.rank||99999)
    : (w=>{ const ls=w.tags.filter(t=>LESSON_TAGS[t]).map(t=>+t.slice(1)); return ls.length?Math.min(...ls):99; });
  const fresh = ws.filter(w=>!(S.cards[cardId(w)]||{}).seen)
                  .map((w,i)=>[w,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]).slice(0, room);
  queue = due.concat(fresh);
}
function startSession(){ queue=[]; if(roundMode()) buildQueue(); nextCard(); }
function nextCard(){
  if(!queue.length && !roundMode()) buildQueue();
  current = queue.shift() || null; phase="ask"; renderCard();
}
const KIND_NAME = {get all(){return t("kn_all")}, get word(){return t("kn_word")}, get phrase(){return t("kn_phrase")}};
function renderCard(){
  const page=$("#cardPage");
  updateSessionMeta();
  if(!current){
    const set=S.settings.set;
    if(set!=="all"){
      const n=selectedWords().length, total=S[set].length;
      const title = set==="pool" ? t("poolTitle") : t("knownTitle");
      let body;
      if(n) body = `<h2>${t("roundDone")}</h2><p class="meta" style="margin:0">${t("repeated")} <b>${n}</b>. ${set==="known"?t("roundKnownHint"):t("roundPoolHint")}</p>
          <button class="btn primary" id="again" type="button">${t("again")}</button>`;
      else if(total) body = `<h2>${t("noKind",{k:KIND_NAME[S.settings.kind]})}</h2><p class="meta" style="margin:0">${t("noKindBody",{list:title,total,f:S.settings.kind==="word"?t("kindWords"):t("kindPhrases")})}</p>`;
      else body = set==="pool"
        ? `<h2>${t("poolEmptyH")}</h2><p class="meta" style="margin:0;max-width:60ch">${t("poolEmptyB")}</p><button class="btn" id="toDict" type="button">${t("openDict")}</button>`
        : `<h2>${t("knownEmptyH")}</h2><p class="meta" style="margin:0;max-width:60ch">${t("knownEmptyB")}</p><button class="btn" id="toDict" type="button">${t("openDict")}</button>`;
      page.innerHTML = `<div class="done"><div class="eyebrow">${title}</div>${body}</div>`;
      const a=$("#again"); if(a) a.onclick=startSession;
      const d=$("#toDict"); if(d) d.onclick=()=>document.querySelector('nav [data-tab="dict"]').click();
      return;
    }
    const ws=selectedWords(), now=Date.now();
    const tomorrow = ws.filter(w=>{const c=S.cards[cardId(w)];return c&&c.seen&&c.due<=now+DAY;}).length;
    const unseen = ws.filter(w=>!(S.cards[cardId(w)]||{}).seen).length;
    page.innerHTML = `<div class="done"><div class="eyebrow">Na dnes hotovo</div><h2>${t("doneH")}</h2>
      <p class="meta" style="margin:0">${t("doneB",{a:`<b>${tomorrow}</b>`,k:KIND_NAME[S.settings.kind],b:`<b>${unseen}</b>`})}</p>
      ${unseen?`<button class="btn primary" id="moreNew" type="button">${t("moreN",{n:S.settings.newPerDay})}</button>`:""}</div>`;
    const m=$("#moreNew"); if(m) m.onclick=()=>{extraNew+=S.settings.newPerDay; buildQueue(); nextCard();};
    return;
  }
  const w=current, isNew=!(S.cards[cardId(w)]||{}).seen;
  const labels = S.settings.src==="lib"&&w.cat ? [esc(CATS[w.cat])].concat(w.rank?[t("rankLabel",{n:w.rank})]:[]) : w.tags.filter(t=>t!=="phr"&&LESSON_TAGS[t]||t==="mine").map(t=>esc(TAGS[t]||t));
  if(isPhrase(w)) labels.push(t("phrase"));
  const eyebrow = `<div class="cardhead"><div class="eyebrow"><span>${labels.join(" · ")}</span>${w.g?`<span>${GENDER[w.g]}</span>`:""}${w.tags.includes("ff")?`<span class="ff">${t("falseFriend")}</span>`:""}${isNew?`<span>${t("isNew")}</span>`:""}</div>
    <div class="marks">${markBtn("star",w,true)}${markBtn("known",w,true)}</div></div>`;
  if(S.settings.mode==="type"){
    page.innerHTML = `${eyebrow}<p class="prompt">${esc(w.ru)}<small>${t("typeHint")}</small></p>
      <div class="answer-row"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="sk" aria-label="${t("ansLabel")}"><button class="btn primary" id="checkBtn" type="button">${t("check")}</button></div>
      <div class="keys" id="kp"></div>
      <div id="res"></div>`;
    keypad($("#kp"));
    const inp=$("#ans"); inp.focus();
    const go=()=>{ if(phase==="ask") answerTyped(inp.value); };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); go(); }});
    $("#checkBtn").onclick=go;
  } else {
    page.innerHTML = `${eyebrow}<div class="sayrow"><p class="prompt" lang="sk">${esc(w.sk)}<small>${t("flipHint")}</small></p>${sayBtn(w.sk,"big")}</div>
      <div><button class="btn primary" id="showBtn" type="button">${t("show")} <kbd>Space</kbd></button></div><div id="res"></div>`;
    $("#showBtn").onclick=revealFlip; $("#showBtn").focus();
    TTS.auto(w.sk);
  }
}
function gradeButtons(defs, primaryIdx){
  return `<div class="grades">${defs.map((d,i)=>`<button class="btn ${i===primaryIdx?"primary":""}" type="button" data-q="${d[1]}">${d[0]}<kbd>${i+1}</kbd></button>`).join("")}</div>`;
}
function bindGrades(container, primaryIdx){
  const bs=container.querySelectorAll("[data-q]");
  bs.forEach(b=>b.onclick=()=>gradeWord(+b.dataset.q));
  if(bs[primaryIdx]) bs[primaryIdx].focus();
}
function answerTyped(val){
  if(!val.trim()) return;
  phase="graded";
  const w=current; let res=check(val, variants(w.sk)), alt=null;
  if(res.r==="bad"){ for(const o of synonymsOf(w)){ const r2=check(val, variants(o.sk)); if(r2.r!=="bad"){ alt=o; res={r:"ok"}; break; } } }
  const inp=$("#ans"); inp.disabled=true; $("#checkBtn").hidden=true;
  const shown = res.r==="near" ? markDiff(res.a,val) : esc(w.sk);
  const verdict = alt ? t("altOk",{w:alt.sk}) : {ok:t("ok"),near:t("near"),bad:t("bad")}[res.r];
  const note = w.note ? `<div class="note">${esc(w.note)}</div>` : "";
  let grades, prim;
  if(res.r==="bad"){ grades=[[t("next"),0],[t("typo"),4]]; prim=0; }
  else { grades=[[t("hard"),3],[t("good"),4],[t("easy"),5]]; prim=1; }
  $("#res").innerHTML = `<div class="result ${res.r}"><span class="verdict">${verdict}</span>
    <span class="sayrow"><span class="correct" lang="sk">${shown}</span>${sayBtn(w.sk)}</span>
    ${res.r==="bad"?`<span class="yours">${t("youWrote")} <s lang="sk">${esc(val)}</s></span>`:""}${note}</div>${gradeButtons(grades,prim)}`;
  bindGrades($("#res"), prim);
  TTS.auto(w.sk);
}
function revealFlip(){
  if(phase!=="ask") return; phase="graded";
  const w=current; $("#showBtn").parentElement.hidden=true;
  $("#res").innerHTML = `<div class="result ok" style="background:var(--accent-soft)"><span class="correct" style="font-size:24px">${esc(w.ru)}</span>${w.note?`<div class="note">${esc(w.note)}</div>`:""}</div>
    ${gradeButtons([[t("forgot"),0],[t("hard"),3],[t("good"),4],[t("easy"),5]],2)}`;
  bindGrades($("#res"),2);
}
function gradeWord(q){
  const id=cardId(current), c=S.cards[id], wasNew=!(c||{}).seen;
  /* repeating a pool word before it is due: a miss resets it, a success doesn't stretch the interval */
  const early = c && c.seen && c.due > Date.now();
  if(early && q>=3){ const k=dayKey(); S.log[k]=S.log[k]||{n:0,ok:0}; S.log[k].n++; S.log[k].ok++; }
  else schedule(id,q);
  if(wasNew){ const k=dayKey(); S.newLog[k]=(S.newLog[k]||0)+1; }
  if(q<3) queue.splice(Math.min(3,queue.length),0,current);
  persist(); nextCard();
}
function updateSessionMeta(){
  if(roundMode()){
    $("#sessionMeta").innerHTML = t("metaRound",{list:S.settings.set==="pool"?t("metaPool"):t("metaKnown"),n:`<b>${S[S.settings.set].length}</b>`,m:`<b>${queue.length+(current?1:0)}</b>`});
    return;
  }
  const ws=selectedWords(), now=Date.now();
  const due=ws.filter(w=>{const c=S.cards[cardId(w)];return c&&c.seen&&c.due<=now;}).length;
  $("#sessionMeta").innerHTML = t("metaDue",{a:`<b>${due}</b>`,b:`<b>${newDoneToday()}</b>`,c:S.settings.newPerDay+extraNew});
}

/* ============ VERBS ============ */
let vCur=null, vLast=null, vPhase="ask";
function verbPool(){ return S.settings.vset==="core" ? VERBS.filter(v=>v.core) : S.settings.vset==="lesson" ? VERBS.filter(v=>LESSON_VERBS.has(v.inf)) : VERBS; }
function vId(v){ return "v:"+v.inf+":"+S.settings.tense; }
function pickVerb(){
  const now=Date.now(), pool=verbPool().filter(v=>v!==vLast||verbPool().length<2);
  const due = pool.filter(v=>{const c=S.cards[vId(v)];return c&&c.seen&&c.due<=now;});
  const fresh = pool.filter(v=>!(S.cards[vId(v)]||{}).seen);
  let group, free=false;
  if(due.length) group=due.sort((a,b)=>S.cards[vId(a)].due-S.cards[vId(b)].due).slice(0,3);
  else if(fresh.length) group=fresh.slice(0,3);
  else { group=pool.slice().sort((a,b)=>S.cards[vId(a)].ef-S.cards[vId(b)].ef).slice(0,6); free=true; }
  const v = group[Math.floor(Math.random()*group.length)];
  const forms = verbForms(v,S.settings.tense);
  const idx = Math.floor(Math.random()*forms.length);
  vCur={v,forms,idx,free}; vLast=v; vPhase="ask"; renderVerb();
}
function renderVerb(){
  const {v,forms,idx,free}=vCur, page=$("#verbPage"), past=S.settings.tense==="past";
  const pool=verbPool(), now=Date.now();
  const due=pool.filter(x=>{const c=S.cards[vId(x)];return c&&c.seen&&c.due<=now;}).length;
  const fresh=pool.filter(x=>!(S.cards[vId(x)]||{}).seen).length;
  $("#verbMeta").innerHTML = free ? t("vFree") : t("vMeta",{a:`<b>${due}</b>`,b:`<b>${fresh}</b>`});
  const tenseLabel = past ? t("tPast") : (v.pf ? t("tPf") : t("tPres"));
  page.innerHTML = `<div class="eyebrow"><span>${tenseLabel}</span>${v.refl?`<span>${t("refl")}: ${v.refl}</span>`:""}</div>
    <p class="prompt"><span style="color:var(--accent)">${esc(forms[idx].p)}</span> · <span lang="sk">${esc(v.inf)}</span> ${sayBtn(v.inf,"sm")}<small>${esc(v.ru)}${past&&forms[idx].p==="ja"?" · "+t("masc"):""}</small></p>
    <div class="answer-row"><input id="vans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="sk" aria-label="${t("vAnsLabel")}"><button class="btn primary" id="vcheck" type="button">${t("check")}</button></div>
    <div class="keys" id="vkp"></div>
    <p class="hint" style="margin:0">${past?t("pastHint"):t("presHint")}</p>
    <div id="vres"></div>`;
  keypad($("#vkp"));
  const inp=$("#vans"); inp.focus();
  const go=()=>{ if(vPhase==="ask") answerVerb(inp.value); };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); go(); }});
  $("#vcheck").onclick=go;
}
function answerVerb(val){
  if(!val.trim()) return; vPhase="graded";
  const {v,forms,idx,free}=vCur, f=forms[idx];
  const res=check(val, f.acc);
  $("#vans").disabled=true; $("#vcheck").hidden=true;
  const shown = res.r==="near" ? markDiff(res.a,val) : esc(f.shown);
  const verdict={ok:t("ok"),near:t("near"),bad:t("badVerb")}[res.r];
  const table = forms.map((x,i)=>`<tr class="${i===idx?"asked":""}"><td>${esc(x.p)}</td><td lang="sk">${esc(x.shown)}</td><td class="saycell">${sayBtn(x.shown,"sm")}</td></tr>`).join("");
  TTS.auto(f.shown);
  $("#vres").innerHTML = `<div class="result ${res.r}"><span class="verdict">${verdict}</span><span class="sayrow"><span class="correct" lang="sk">${shown}</span>${sayBtn(f.shown)}</span>
      ${res.r==="bad"?`<span class="yours">${t("youWrote")} <s lang="sk">${esc(val)}</s></span>`:""}</div>
    <table class="conj">${table}</table>
    <div class="grades">${res.r==="bad"?`<button class="btn" type="button" data-v="4">${t("typo")}</button>`:""}<button class="btn primary" type="button" data-v="${res.r==="bad"?0:4}">${t("next")} <kbd>Enter</kbd></button></div>`;
  const bs=$("#vres").querySelectorAll("[data-v]");
  bs.forEach(b=>b.onclick=()=>{ const q=+b.dataset.v;
    const id=vId(v), c=S.cards[id];
    if(!free || q<3) schedule(id,q);
    else { const k=dayKey(); S.log[k]=S.log[k]||{n:0,ok:0}; S.log[k].n++; S.log[k].ok++; }
    persist(); pickVerb(); });
  bs[bs.length-1].focus();
}

/* ============ DICTIONARY ============ */
function dictFilterOptions(){
  const lib=S.settings.src==="lib", ws=allWords().filter(inSource);
  const sel=$("#dictFilter"), cur=sel.value||"all";
  let groups;
  if(lib){
    const counts={}; ws.forEach(w=>counts[w.cat]=(counts[w.cat]||0)+1);
    groups = `<optgroup label="${t("freq")}">${TOPS.map(n=>`<option value="top${n}">${t("top",{n})}</option>`).join("")}</optgroup>`+
      `<optgroup label="${t("topics")}">${Object.keys(CATS).filter(c=>counts[c]).map(c=>`<option value="cat:${c}">${esc(CATS[c])} (${counts[c]})</option>`).join("")}</optgroup>`;
  } else {
    const counts={}; ws.forEach(w=>w.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
    groups = `<optgroup label="${t("lessons")}">${Object.keys(LESSON_TAGS).concat(["mine"]).filter(k=>counts[k]).map(k=>`<option value="${k}">${esc(TAGS[k])} (${counts[k]})</option>`).join("")}</optgroup>`;
  }
  sel.innerHTML = `<option value="all">${lib?t("allLib"):t("allLessons")}</option><option value="pool">★ ${t("poolTitle")} (${S.pool.length})</option><option value="known">✓ ${t("knownTitle")} (${S.known.length})</option><option value="learning">${t("learning")}</option>`+groups;
  sel.value = [...sel.options].some(o=>o.value===cur) ? cur : "all";
}
let dictShown=[];
function dictMatch(w,f){
  if(f==="all") return true; if(f==="pool") return inPool(w.id); if(f==="known") return isKnown(w.id);
  if(f==="learning") return !isKnown(w.id);
  if(f.startsWith("top")) return w.rank && w.rank<=+f.slice(3);
  if(f.startsWith("cat:")) return w.cat===f.slice(4);
  return w.tags.includes(f);
}
function renderDict(){
  dictFilterOptions();
  const q=baseNorm($("#search").value||""), f=$("#dictFilter").value, k=$("#dictKind").value;
  const lists = f==="pool"||f==="known";
  dictShown=allWords().filter(w=>(lists||inSource(w)) && dictMatch(w,f) && (k==="all"||(k==="phrase")===isPhrase(w)) &&
    (!q || baseNorm(w.sk).includes(q) || w.ru.toLowerCase().includes(q)));
  if(S.settings.src==="lib") dictShown.sort((a,b)=>(a.rank||99999)-(b.rank||99999));
  const ws=dictShown;
  const pillFor=w=>{ if(isKnown(w.id)) return `<span class="pill known">${t("pillKnown")}</span>`;
    const a=status(w.id+":t"), b=status(w.id+":r");
    const st = (a==="known"&&b!=="new")||(b==="known"&&a!=="new") ? "known" : (a==="new"&&b==="new" ? "new" : "learn");
    return `<span class="pill ${st}">${{new:t("pillNew"),learn:t("pillLearn"),known:t("pillLearned")}[st]}</span>`; };
  const empty = {pool:t("dictEmptyPool"), known:t("dictEmptyKnown")}[f];
  $("#dictTable").innerHTML = `<thead><tr><th><span class="vh">${t("marks")}</span></th><th>Slovensky</th><th>${t("thTr")}</th><th>${S.settings.src==="lib"?t("thFreqTopic"):t("thLessonTopic")}</th><th></th></tr></thead><tbody>`+
    ws.map(w=>`<tr class="${isKnown(w.id)?"is-known":""}"><td class="markcell">${markBtn("star",w)}${markBtn("known",w)}</td><td class="sk" lang="sk">${sayBtn(w.sk,"sm")}${esc(w.sk)}${w.g?` <span class="meta">${GENDER[w.g]}</span>`:""}</td><td>${esc(w.ru)}${w.note?`<div class="meta">${esc(w.note)}</div>`:""}</td><td>${pillFor(w)}<div class="meta">${(S.settings.src==="lib" ? (w.rank?[`№ ${w.rank}`]:[]).concat(w.cat?[esc(CATS[w.cat])]:[]) : w.tags.filter(t=>t!=="phr").map(t=>esc(TAGS[t]||t))).concat(isPhrase(w)?[t("phrase")]:[]).join(", ")}</div></td>
    <td>${w.tags.includes("mine")?`<button class="x" type="button" data-del="${esc(w.id)}" aria-label="${t("del")} ${esc(w.sk)}">✕</button>`:""}</td></tr>`).join("")+
    (ws.length?"":`<tr><td colspan="5" class="meta">${!q&&empty?empty:t("nothing")}</td></tr>`)+"</tbody>";
  $("#dictTable").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.del; S.custom=S.custom.filter(c=>c.id!==id); S.pool=S.pool.filter(x=>x!==id); S.known=S.known.filter(x=>x!==id);
    delete S.cards[id+":t"]; delete S.cards[id+":r"]; persist(); renderDict(); renderTags(); });
  updateBulk();
}
function updateBulk(){
  const n=dictShown.length, inP=dictShown.filter(w=>inPool(w.id)).length, inK=dictShown.filter(w=>isKnown(w.id)).length;
  $("#bulkMeta").innerHTML = t("bulkMeta",{n:`<b>${n}</b>`,p:`<b>${inP}</b>`,k:`<b>${inK}</b>`});
  const set=(id,txt,dis)=>{ const b=$(id); b.textContent=txt; b.disabled=dis; };
  set("#bulkAdd",t("bulkAdd",{n:n-inP}), n===inP);
  set("#bulkDel",t("bulkDel",{n:inP}), !inP);
  set("#knownAdd",t("knownAdd",{n:n-inK}), n===inK);
  set("#knownDel",t("knownDel",{n:inK}), !inK);
  $("#bulkConfirm").hidden = true;
}
function bulk(name, on){
  const ids=dictShown.filter(w=>(name==="pool"?inPool(w.id):isKnown(w.id))!==on).map(w=>w.id);
  const go=()=>{ setList(name,ids,on); renderDict(); };
  if(on && ids.length>60){
    $("#bulkConfirmText").textContent = name==="pool" ? t("confPool",{n:ids.length}) : t("confKnown",{n:ids.length});
    $("#bulkConfirm").hidden=false; $("#bulkYes").onclick=go; $("#bulkYes").focus(); return;
  }
  go();
}
$("#dictFilter").addEventListener("change",renderDict);
$("#dictKind").addEventListener("change",renderDict);
$("#bulkAdd").onclick=()=>bulk("pool",true);
$("#bulkDel").onclick=()=>bulk("pool",false);
$("#knownAdd").onclick=()=>bulk("known",true);
$("#knownDel").onclick=()=>bulk("known",false);
$("#bulkNo").onclick=()=>{ $("#bulkConfirm").hidden=true; };
$("#addForm").addEventListener("submit",e=>{

$("#search").addEventListener("input",renderDict);

/* ============ STATS ============ */
/* A word counts as known if it's marked ✓ or its card has reached a 7-day interval. */
function knownLemmas(){
  const ids=new Set(S.known), set=new Set();
  for(const w of allWords()){
    if(!w.lemma) continue;
    const t=S.cards[w.id+":t"], r=S.cards[w.id+":r"];
    if(ids.has(w.id) || (t&&t.seen&&t.iv>=7) || (r&&r.seen&&r.iv>=7)) set.add(w.lemma);
  }
  return set;
}
function renderCoverage(){
  const kl=knownLemmas(); let cov=0; kl.forEach(l=>cov+=FREQ[l]||0);
  const lib=allWords().filter(w=>w.rank).sort((a,b)=>a.rank-b.rank);
  const topKnown=n=>lib.filter(w=>w.rank<=n && kl.has(w.lemma)).length;
  const next=lib.filter(w=>!kl.has(w.lemma) && !isKnown(w.id)).slice(0,6);
  const pct=Math.min(100,cov);
  $("#cover").innerHTML = `<div class="cover-head"><div><div class="eyebrow">${t("coverEy")}</div>
      <div class="cover-num">${pct.toFixed(1).replace(".",",")}<span>%</span></div></div>
      <p class="meta" style="margin:0;max-width:46ch">${t("coverB")}</p></div>
    <div class="cover-bar" role="img" aria-label="${t("coverEy")} ${pct.toFixed(1)}%"><i style="width:${pct}%"></i>${[50,70,80].map(m=>`<s style="left:${m}%"><em>${m}%</em></s>`).join("")}</div>
    <div class="cover-tops">${[100,500,1000].map(n=>`<span>${t("top",{n})}: <b>${topKnown(n)}</b> / ${lib.filter(w=>w.rank<=n).length}</span>`).join("")}</div>
    ${next.length?`<div class="cover-next"><span class="meta">${t("coverNext")}</span>${next.map(w=>`<span class="nextw">${sayBtn(w.sk,"sm")}<span lang="sk">${esc(w.sk)}</span> <span class="meta">${esc(w.ru)}</span>${markBtn("star",w)}</span>`).join("")}</div>`:""}`;
}
function renderStats(){
  const ids=Object.keys(S.cards).filter(k=>S.cards[k].seen);
  const wordIds=ids.filter(k=>!k.startsWith("v:"));
  const known=wordIds.filter(k=>S.cards[k].iv>=21).length;
  const today=(S.log[dayKey()]||{n:0}).n;
  let streak=0; for(let i=0;i<400;i++){ const k=dayKey(Date.now()-i*DAY); if(S.log[k]&&S.log[k].n){streak++;} else if(i>0) break; }
  const acc=(()=>{let n=0,ok=0;for(let i=0;i<7;i++){const l=S.log[dayKey(Date.now()-i*DAY)];if(l){n+=l.n;ok+=l.ok;}}return n?Math.round(ok/n*100)+"%":"—";})();
  $("#tiles").innerHTML=[[today,t("tToday")],[streak,t("tStreak")],[known+" / "+wordIds.length,t("tLearned")],[acc,t("tAcc")]]
    .map(([b,s])=>`<div class="tile"><b>${b}</b><span>${s}</span></div>`).join("");
  const days=[]; let max=1;
  for(let i=13;i>=0;i--){ const t=Date.now()-i*DAY, n=(S.log[dayKey(t)]||{n:0}).n; max=Math.max(max,n); days.push([t,n]); }
  $("#days").innerHTML=days.map(([t,n])=>`<div title="${dayKey(t)}: ${n}"><i class="${n?"":"zero"}" style="height:${n?Math.max(4,n/max*70):2}px"></i><small>${new Date(t).getDate()}</small></div>`).join("");
  renderCoverage();
  $("#newPerDay").value=String(S.settings.newPerDay);
  $("#storageInfo").textContent = t("storLocal");
}
function setBatch(n){
  S.settings.newPerDay=n; persist();
  $("#batchSel").value=$("#newPerDay").value=String(n);
  if(!roundMode()){ queue=[]; nextCard(); }
}

$("#importBtn").onclick=()=>{

function importState(text){

}
$("#dlBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(S)],{type:"application/json"});

$("#fileIn").onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;

$("#resetBtn").onclick=()=>{$("#resetConfirm").hidden=false;};

let tab="cards";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",String(x===b)));

  if(tab==="verbs"&&!vCur) pickVerb();
  if(tab==="verbs"&&vCur&&vPhase==="ask") $("#vans").focus();
  if(tab==="cards"&&phase==="ask"&&$("#ans")) $("#ans").focus();
  if(tab==="dict") renderDict();
  if(tab==="stats") renderStats();
});
function segment(sel, key, attr, after){
  document.querySelectorAll(sel+" button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset[attr]===S.settings[key]));
    b.onclick=()=>{ S.settings[key]=b.dataset[attr]; persist();
      document.querySelectorAll(sel+" button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); after(); };
  });
}
let filterOpen=false;
function renderTags(){
  const set=S.settings.set, kind=S.settings.kind, lib=S.settings.src==="lib";
  const srcWords=allWords().filter(inSource);
  const phrases=srcWords.filter(isPhrase).length, words=srcWords.length-phrases;
  const chipBtn=(attr,val,label,n,on)=>`<button class="chip" type="button" data-${attr}="${val}" aria-pressed="${on}">${esc(label)}${n!==undefined?` <span class="n">${n}</span>`:""}</button>`;
  let rows, picked;
  if(lib){
    const counts={}; srcWords.forEach(w=>counts[w.cat]=(counts[w.cat]||0)+1);
    const top=S.settings.top;
    picked=S.settings.cats.map(c=>CATS[c]).concat(top?[t("top",{n:top})]:[]);
    rows = `<div class="bar"><span class="grp">${t("freq")}</span>${chipBtn("top",0,t("allShort"),undefined,set==="all"&&!top)}${TOPS.map(n=>chipBtn("top",n,t("top",{n}),undefined,set==="all"&&top===n)).join("")}</div>
      <div class="bar"><span class="grp">${t("topics")}</span>${Object.keys(CATS).filter(c=>counts[c]).map(c=>chipBtn("cat",c,CATS[c],counts[c],set==="all"&&S.settings.cats.includes(c))).join("")}</div>`;
  } else {
    const counts={}; srcWords.forEach(w=>w.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
    picked=S.settings.tags.map(t=>TAGS[t]).filter(Boolean);
    rows = `<div class="bar"><span class="grp">${t("lessons")}</span>${Object.keys(LESSON_TAGS).concat(["mine"]).filter(k=>counts[k]).map(k=>chipBtn("tag",k,TAGS[k],counts[k],set==="all"&&S.settings.tags.includes(k))).join("")}</div>`;
  }
  const summary = set!=="all" ? t("notApplied") : (picked.length ? picked.join(", ") : t("allLower"));
  $("#tagBar").innerHTML =
    `<div class="bar"><span class="grp">${t("setLabel")}</span>
      ${chipBtn("set","all",lib?t("allLib"):t("allLessons"),srcWords.length,set==="all")}
      <button class="chip pool" type="button" data-set="pool" aria-pressed="${set==="pool"}">${t("picksChip")} <span class="n">${S.pool.length}</span></button>
      <button class="chip knownchip" type="button" data-set="known" aria-pressed="${set==="known"}">${t("knownChip")} <span class="n">${S.known.length}</span></button></div>`+
    `<div class="bar"><span class="grp">${t("what")}</span><div class="seg" role="group" aria-label="${t("kindLabel")}">
      <button type="button" data-kind="all" aria-pressed="${kind==="all"}">${t("kindAll")}</button>
      <button type="button" data-kind="word" aria-pressed="${kind==="word"}">${t("kindWords")} <span class="n">${words}</span></button>
      <button type="button" data-kind="phrase" aria-pressed="${kind==="phrase"}">${t("kindPhrases")} <span class="n">${phrases}</span></button></div></div>`+
    `<details class="filterbox ${set!=="all"?"dim":""}" id="filterBox" ${filterOpen?"open":""}><summary>${lib?t("freqAndTopics"):t("lessons")}: <b>${esc(summary)}</b></summary>
      <div class="inner">${rows}
      ${picked.length&&set==="all"?`<div><button class="btn quiet" type="button" data-clear style="padding:4px 0">${t("clearSel")}</button></div>`:""}</div></details>`;
  $("#filterBox").addEventListener("toggle",e=>{ filterOpen=e.target.open; });
  $("#tagBar").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const st=S.settings;
    if(b.hasAttribute("data-clear")){ st.tags=[]; st.cats=[]; st.top=0; }
    else if(b.dataset.set){ const v=b.dataset.set; st.set = (v!=="all" && st.set===v) ? "all" : v; }
    else if(b.dataset.kind){ st.kind=b.dataset.kind; }
    else if(b.dataset.top!==undefined){ st.set="all"; st.top=+b.dataset.top; }
    else if(b.dataset.cat){ st.set="all"; const c=b.dataset.cat, i=st.cats.indexOf(c); i<0?st.cats.push(c):st.cats.splice(i,1); }
    else { st.set="all"; const t=b.dataset.tag, i=st.tags.indexOf(t); i<0?st.tags.push(t):st.tags.splice(i,1); }
    persist(); renderTags(); startSession();
  });
}
function renderSrc(){
  document.querySelectorAll(".src button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.src===S.settings.src)));
  const ws=allWords();
  $("#srcLessons").textContent = t("srcLessonsSub",{n:ws.filter(inLessons).length});
  $("#srcLib").textContent = t("srcLibSub",{n:ws.filter(inLibrary).length});
}
document.querySelectorAll(".src button").forEach(b=>b.onclick=()=>{
  if(S.settings.src===b.dataset.src) return;
  S.settings.src=b.dataset.src; if(S.settings.set!=="all") S.settings.set="all";
  persist(); renderSrc(); renderTags(); startSession(); if(tab==="dict") renderDict(); if(tab==="stats") renderStats();
});
function refreshCounts(){
  const now=Date.now();
  const known=new Set(S.known);
  const due=allWords().filter(w=>{if(known.has(w.id)) return false; const c=S.cards[w.id+":"+(S.settings.mode==="type"?"t":"r")];return c&&c.seen&&c.due<=now;}).length;
  $("#dueCount").textContent=due;
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")) return;

  }
});

function applySkin(){

  document.querySelectorAll("[data-skin]").forEach(b=>{ if(b.tagName==="BUTTON"){ b.setAttribute("aria-pressed",String(b.dataset.skin===(k||"auto"))); b.title=t("th_"+b.dataset.skin); b.setAttribute("aria-label",t("th_"+b.dataset.skin)); }});

function applyLang(){

  fillTagNames();
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));

document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{ S.settings.lang=b.dataset.lang; persist(); applyLang(); rerenderAll(); });
document.querySelectorAll("button[data-skin]").forEach(b=>b.onclick=()=>{ S.settings.skin=b.dataset.skin; persist(); applySkin(); });

  applyLang();
  $("#ttsAuto").checked=!!S.settings.ttsAuto; $("#ttsRate").value=String(S.settings.ttsRate||0.9); TTS.update();

  if(tab==="verbs") pickVerb(); else vCur=null;
  if(tab==="dict") renderDict();
  if(tab==="stats") renderStats();
}

keypad(document.querySelector('.keys[data-target="addSk"]'),"addSk");
try{ $("#today").textContent = new Date().toLocaleDateString("sk-SK",{weekday:"long",day:"numeric",month:"long"}); }catch(e){}
setSave("local");
rerenderAll();
TTS.init();

/* connect account storage; adopt whichever copy is newer */
(async()=>{
  const ok = await Store.connect();
  if(!ok){ setSave("local"); return; }
  setSave("db");
  try{
    const remote = await Store.loadRemote();
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
      S=normalize(remote);
      Store.writeLocal(S); rerenderAll();
    } else if(S.updatedAt){ Store.save(S); }
  }catch(e){ setSave("err"); }
  if(tab==="stats") renderStats();
})();
